name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib gcc-mingw-w64-i686 gcc-mingw-w64-x86-64

      - name: make test
        run: make test
